## Manta M8P V2.0
# M1[DIR:PE5,STEP:PE6,EN:PC14,CS:PC13] - - NEMA14
# M2[DIR:PE1,STEP:PE2,EN:PE4,CS:PE3] - - NEMA14
# M3[DIR:PB7,STEP:PB8,EN:PE0,CS:PB9] - rear right - NEMA17
# M4[DIR:PB3,STEP:PB4,EN:PB6,CS:PB5] - front right - NEMA17
# M5[DIR:PG12,STEP:PG13,EN:PG15,CS:PG14] - front left - NEMA17
# M6[DIR:PD7,STEP:PG9,EN:PG11,CS:PG10] - rear left - NEMA17
# EndstopY[PF4]
# HE1[VBB PA1] - heatbed
# THB[PB1] - heatbed thermister

## EBB36 CAN V1.2
# EndstopX[EBBCan:PB6]
# Probe[EBBCan:PB9]
# Extruder[DIR:EBBCan:PD1,STEP:EBBCan:PD0,EN:EBBCan:PD2,UART:EBBCan:PA15] - NEMA14 Round Stepper with 10T Gear
# Fan1[EBBCan:PA0] - E3D revo fan
# Fan2[EBBCan:PA1] - part cooling fan


# tune z belts to 870 hz F

[include mainsail.cfg]
[include klicky.cfg]

# host MCU service is preinstalled and ready to use with:
[mcu CB1]
serial: /tmp/klipper_host_mcu

[mcu]
canbus_uuid: 193e1cfccaf3
canbus_interface: can0

[mcu EBBCan]
canbus_uuid: dcfb69ea240e
canbus_interface: can0

[printer]
kinematics: corexy
max_velocity: 200
max_accel: 5000
max_z_velocity: 25
max_z_accel: 350

################
# X/Y Steppers #
################

# Motor1
[stepper_x]
step_pin: PE2
dir_pin: PE1
enable_pin: !PE4
microsteps: 16
full_steps_per_rotation: 200
rotation_distance: 32
endstop_pin: ^EBBCan:PB6
position_endstop: 173
position_max: 173
position_min: 1
homing_speed: 60
homing_retract_dist: 5

[tmc2209 stepper_x]
uart_pin: PE3
run_current: 0.800
stealthchop_threshold: 999999

# Motor2
[stepper_y]
step_pin: PE6
dir_pin: PE5
enable_pin: !PC14
microsteps: 16
full_steps_per_rotation: 200
rotation_distance: 32
endstop_pin: ^PF4
position_endstop: 190
position_max: 190
position_min: 0
homing_speed: 60
homing_retract_dist: 5

[tmc2209 stepper_y]
uart_pin: PC13
run_current: 0.800
stealthchop_threshold: 999999

##############
# Z Steppers #
##############

## Z0 Stepper - Front Left 
[stepper_z]
step_pin: PG13
dir_pin: PG12
enable_pin: !PG15
rotation_distance: 32
gear_ratio: 64:16
microsteps: 32
endstop_pin:  probe:z_virtual_endstop
position_max: 165
position_min: -5
homing_speed: 8
second_homing_speed: 3
homing_retract_dist: 3

[tmc2209 stepper_z]
uart_pin: PG14
interpolate: true
run_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 999999

##	Z1 Stepper - Rear Left 
[stepper_z1]
step_pin: PG9
dir_pin: !PD7
enable_pin: !PG11
rotation_distance: 32
gear_ratio: 64:16
microsteps: 32

[tmc2209 stepper_z1]
uart_pin: PG10
interpolate: true
run_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 999999

##	Z2 Stepper - Rear Right 
[stepper_z2]
step_pin: PB8
dir_pin: PB7
enable_pin: !PE0
rotation_distance: 32
gear_ratio: 64:16
microsteps: 32

[tmc2209 stepper_z2]
uart_pin: PB9
interpolate: true
run_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 999999

##	Z3 Stepper - Front Right 
[stepper_z3]
step_pin: PB4
dir_pin: !PB3
enable_pin: !PB6
rotation_distance: 32
gear_ratio: 64:16
microsteps: 32

[tmc2209 stepper_z3]
uart_pin: PB5
interpolate: true
run_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 999999

##########
# Klicky #
##########

# These sections override values from klicky.cfg, so they must stay below the include

[probe]
pin: ^EBBCan:PB9
# official value is 20, a bit too fast and it hits the bed
speed: 5
#z_offset: 5

[gcode_macro _User_Variables]
# official value is 24; 25.5 lines up with this printer's dock
variable_docklocation_x: 25.5
# official value is 50, which reaches the cable chain at the rear
variable_dockmove_x: 35
# distance from the X endstop (173) before homing Y; official 100 homes Y at X73, 73 homes it at X100
variable_home_backoff_x: 73

[quad_gantry_level]
speed: 100
horizontal_move_z: 8
retries: 5
retry_tolerance: 0.0075
max_adjust: 10
gantry_corners:
   -60.2,-10.4
   244.1,234.5
points:
   13,1
   13,140
   160,140
   160,1

###############
# Fan Control #
###############

[fan]
##	Part Cooling Fan
pin: EBBCan:PA1
kick_start_time: 0.5
##	Depending on your fan, you may need to increase this value
##	if your fan will not start. Can change cycle_time (increase)
##	if your fan is not able to slow down effectively
off_below: 0.10

# temporary: lets the hotend fan be switched by hand until [extruder] exists.
# Switch back to the heater_fan below before the hotend heater is configured.
[fan_generic hotend_fan]
pin: EBBCan:PA0
kick_start_time: 0.5
max_power: 1.0

